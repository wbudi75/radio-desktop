<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Radio Ibnul Qoyyim</title>
  <meta name="description" content="Radio Ibnul Qoyyim Balikpapan - Aplikasi radio online desktop." />

  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app">
    <section class="radio-card">
      <div class="header">
        <div class="logo">IQ</div>

        <div>
          <p class="eyebrow">Live Streaming</p>
          <h1>Radio Ibnul Qoyyim</h1>
          <p class="location">Balikpapan</p>
        </div>
      </div>

      <div class="status-panel">
        <div id="statusDot" class="status-dot standby"></div>
        <div>
          <p class="status-label">Status</p>
          <p id="statusText" class="status-text">Siap memutar radio</p>
        </div>
      </div>

      <div class="now-playing">
        <p class="label">Sedang Diputar</p>
        <h2 id="songTitle">Memuat info kajian...</h2>
      </div>

      <div class="listeners-box">
        <p class="label">Pendengar Online</p>
        <p><span id="listenersTotal">0</span> Pendengar</p>
      </div>

      <div class="controls">
        <button id="playButton" class="btn primary" type="button">
          Play Radio
        </button>

        <button id="pauseButton" class="btn warning" type="button">
          Pause
        </button>

        <button id="stopButton" class="btn secondary" type="button">
          Stop
        </button>
      </div>

      <div class="info">
        <p>
          Jika audio tidak langsung berjalan, tekan tombol <strong>Play Radio</strong>.
        </p>
         <p id="lastUpdate">Belum ada update.</p>
      </div>
    </section>

    <footer>
      <p>&copy; <span id="year"></span> Radio Ibnul Qoyyim. All rights reserved.</p>
    </footer>
  </main>

  <script type="module" src="./main.js"></script>
</body>
</html>
